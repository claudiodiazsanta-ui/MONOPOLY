<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<title>BonPasPoly</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0f3d2e;color:#f4f1e6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:#ffd54a;color:#2b2200;font-weight:700;cursor:pointer}
button.alt{background:#1f6b50;color:#f4f1e6}
button.dark{background:#0b2a20;color:#f4f1e6;border:1px solid #2c7a5c}
button.red{background:#c0392b;color:#fff}
button.sm{padding:7px 10px;font-size:.82rem;border-radius:9px}
button:disabled{opacity:.35;cursor:default}
input,select{font:inherit;padding:12px;border-radius:10px;border:2px solid #2c7a5c;background:#0b2a20;color:#f4f1e6;width:100%}
input[type=checkbox]{width:auto}
h1,h2,h3{margin:.3em 0}
.home{max-width:520px;margin:0 auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.logo{font-size:2.3rem;font-weight:900;letter-spacing:1px;text-align:center;color:#ffd54a;text-shadow:0 3px 0 #b8860b,0 6px 12px rgba(0,0,0,.4);margin-top:10px;line-height:1}
.sub{text-align:center;opacity:.8;margin-top:-4px}
.card{background:#14503b;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.grow{flex:1}
.muted{opacity:.7;font-size:.85rem}
.av{display:inline-block;width:34px;height:34px;border-radius:50%;background-size:cover;background-position:center;border:3px solid #fff;text-align:center;line-height:28px;font-size:18px;flex:none;vertical-align:middle}
.av.big{width:64px;height:64px;line-height:56px;font-size:34px}
.av.xs{width:22px;height:22px;line-height:16px;font-size:12px;border-width:2px}
.plist{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;gap:10px;align-items:center;background:#0b2a20;border-radius:12px;padding:8px 10px}
.code{font-size:3rem;font-weight:900;letter-spacing:8px;text-align:center;color:#ffd54a}
.fam-row{display:flex;gap:8px;align-items:center;background:#0b2a20;border-radius:12px;padding:8px}
/* ===== juego ===== */
#game{display:flex;flex-direction:column;min-height:100dvh}
#hdr{position:sticky;top:0;z-index:5;background:#0b2a20}
#top{display:flex;gap:6px;overflow-x:auto;padding:6px;align-items:stretch}
.chip{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;border-radius:30px;background:#14503b;flex:none;border:2px solid transparent;font-size:.8rem;line-height:1.1}
.chip.turn{border-color:#ffd54a;background:#1f6b50}
.chip.out{opacity:.35;text-decoration:line-through}
.chip b{display:block;font-size:.88rem}
.chip .mon{color:#ffd54a;font-weight:800}
#main{flex:1;display:flex;flex-direction:column}
#boardwrap{width:min(100vw,720px);margin:0 auto;padding:4px}
#board{container-type:inline-size;position:relative;width:100%;aspect-ratio:1;display:grid;grid-template-columns:1.5fr repeat(9,1fr) 1.5fr;grid-template-rows:1.5fr repeat(9,1fr) 1.5fr;gap:1px;background:#244d3a;border:2px solid #244d3a;border-radius:6px}
.cell{background:#eaf3e2;color:#1b2b22;position:relative;display:flex;overflow:hidden;font-size:1.65cqw;line-height:1.05;cursor:pointer;min-width:0;min-height:0}
.cell .band{flex:none;position:relative;display:flex;align-items:center;justify-content:center;gap:1px}
.cell.b{flex-direction:column}.cell.t{flex-direction:column-reverse}.cell.l{flex-direction:row-reverse}.cell.r{flex-direction:row}
.cell.b .band,.cell.t .band{height:22%}.cell.l .band,.cell.r .band{width:24%}
.cell.l .band,.cell.r .band{flex-direction:column}
.cell .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1px;min-width:0;overflow:hidden}
.cell .nm{font-weight:700;word-break:break-word;hyphens:auto}
.cell .pr{opacity:.75;font-size:.9em}
.cell .ic{font-size:2.6em;line-height:1}
.cell.corner{font-size:1.7cqw;align-items:center;justify-content:center;text-align:center;flex-direction:column;font-weight:800}
.cell.corner .ic{font-size:3.4em}
.cell.mort .body{background:repeating-linear-gradient(45deg,#d9d9d9,#d9d9d9 3px,#eee 3px,#eee 6px);opacity:.75}
.hs{display:inline-block;width:1.5cqw;height:1.5cqw;background:#2ecc40;border:1px solid #145a1e;border-radius:1px}
.hs.H{width:3.4cqw;height:1.8cqw;background:#e11}
.tks{position:absolute;inset:auto 0 1px 0;display:flex;flex-wrap:wrap;justify-content:center;pointer-events:none;z-index:3}
.cell.b .tks,.cell.corner .tks{inset:auto 0 1px 0}
.cell.t .tks,.cell.l .tks,.cell.r .tks{inset:auto 0 1px 0}
.tok{width:4.6cqw;height:4.6cqw;border-radius:50%;border:2px solid #fff;background-size:cover;background-position:center;margin:-.5cqw;text-align:center;font-size:3cqw;line-height:3.6cqw;box-shadow:0 1px 3px rgba(0,0,0,.6);transition:transform .15s}
.tok.turn{animation:bob .8s infinite alternate;z-index:4}
.tok.jailed::after{content:"";position:absolute;inset:-2px;border-radius:50%;background:repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.65) 3px 5px)}
.tok{position:relative}
@keyframes bob{from{transform:translateY(0) scale(1)}to{transform:translateY(-3px) scale(1.18)}}
#center{grid-area:2/2/11/11;background:radial-gradient(circle at 50% 40%,#d8efd0,#bfe0c4);color:#1b2b22;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;padding:2cqw;text-align:center;overflow:hidden}
#center .ttl{font-weight:900;font-size:6.2cqw;color:#c0392b;letter-spacing:.3cqw;line-height:1;transform:rotate(-4deg);text-shadow:0 .5cqw 0 rgba(0,0,0,.12)}
#center .ttl small{display:block;font-size:2.2cqw;color:#1b2b22;letter-spacing:.2cqw;transform:none}
.dice{display:flex;gap:3cqw}
.die{width:11cqw;height:11cqw;background:#fff;border-radius:2cqw;box-shadow:0 .6cqw 0 #999,0 1cqw 2cqw rgba(0,0,0,.3);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:1.2cqw}
.die i{display:block;border-radius:50%;margin:12%}
.die i.on{background:#222}
.die.roll{animation:shake .12s infinite}
@keyframes shake{0%{transform:rotate(-12deg) translateY(-2px)}50%{transform:rotate(10deg) translateY(2px)}100%{transform:rotate(-8deg)}}
#center .dice3d{display:flex;gap:6cqw;perspective:70cqw;height:15cqw;align-items:center;justify-content:center}
.dwrap{width:11cqw;height:11cqw;transform-style:preserve-3d}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d}
.face{position:absolute;inset:0;background:linear-gradient(135deg,#fff,#e8e8e8);border-radius:1.8cqw;border:.2cqw solid #bbb;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:1.2cqw;backface-visibility:hidden}
.face i{display:block;border-radius:50%;margin:10%}
.face i.on{background:radial-gradient(circle at 35% 35%,#555,#111)}
.f1{transform:translateZ(5.5cqw)}.f6{transform:rotateY(180deg) translateZ(5.5cqw)}.f3{transform:rotateY(90deg) translateZ(5.5cqw)}.f4{transform:rotateY(-90deg) translateZ(5.5cqw)}.f2{transform:rotateX(90deg) translateZ(5.5cqw)}.f5{transform:rotateX(-90deg) translateZ(5.5cqw)}
.dwrap.throw{animation:toss 1.15s cubic-bezier(.3,.6,.4,1) both}
@keyframes toss{0%{transform:translate(var(--sx),-30cqw) scale(1.7)}38%{transform:translate(calc(var(--sx)*.1),4cqw) scale(1)}52%{transform:translate(0,-7cqw) scale(1.18)}68%{transform:translate(0,2cqw) scale(1)}82%{transform:translate(0,-2cqw) scale(1.04)}100%{transform:translate(0,0) scale(1)}}
#center .say{font-size:2.5cqw;font-weight:600;min-height:7cqw;max-width:90%}
#side{width:100%;max-width:720px;margin:0 auto;padding:6px;display:flex;flex-direction:column;gap:8px}
.panel{background:#14503b;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.panel .big{padding:16px;font-size:1.15rem}
.panel .btns{display:flex;gap:8px;flex-wrap:wrap}
.panel .btns>*{flex:1;min-width:120px}
.mini{display:flex;gap:10px;align-items:stretch;background:#fff;color:#1b2b22;border-radius:10px;overflow:hidden}
.mini .mb{width:14px;flex:none}
.mini .mt{padding:8px;flex:1;font-size:.9rem}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;padding:9px 4px;font-size:.82rem;background:#0b2a20;color:#f4f1e6;border:1px solid #2c7a5c}
.tabs button.on{background:#ffd54a;color:#2b2200}
.tabbody{background:#14503b;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.prow{display:flex;gap:6px;align-items:center;background:#0b2a20;border-radius:10px;padding:6px 8px;flex-wrap:wrap}
.prow .dot{width:14px;height:22px;border-radius:3px;flex:none}
.prow .nm{flex:1;min-width:110px;font-size:.88rem}
.log div{font-size:.82rem;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.warn{background:#7a2c20;border-radius:10px;padding:10px}
.good{background:#1f6b50;border-radius:10px;padding:10px}
.price{color:#ffd54a;font-weight:800}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:20;padding:10px}
#modal.on{display:flex}
#modal .box{background:#14503b;border-radius:16px;padding:14px;max-width:560px;width:100%;max-height:92dvh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.deed{background:#fff;color:#1b2b22;border-radius:8px;overflow:hidden;border:2px solid #222}
.deed .hd{padding:10px;text-align:center;font-weight:900;font-size:1.05rem;border-bottom:2px solid #222}
.deed .bd{padding:10px;font-size:.92rem}
.deed table{width:100%;border-collapse:collapse}
.deed td{padding:2px 0}.deed td:last-child{text-align:right;font-weight:700}
.cardpop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,380px);z-index:30;border-radius:16px;padding:18px;color:#1b2b22;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:pop .35s}
.cardpop.chance{background:#ffb347;border:5px solid #c9701a}
.cardpop.chest{background:#8fd0f5;border:5px solid #2a7fb0}
.cardpop h3{margin:0 0 8px;font-size:1.3rem;letter-spacing:2px}
.cardpop p{font-size:1.1rem;margin:6px 0;font-weight:600}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.4);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:40;display:none;max-width:90vw;text-align:center}
.trade-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.trade-cols>div{background:#0b2a20;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.trade-cols label{display:flex;gap:6px;align-items:center}
.rank{display:flex;gap:10px;align-items:center;padding:6px 8px;background:#0b2a20;border-radius:10px}
.net{position:fixed;top:4px;right:6px;z-index:9;font-size:.7rem;background:#7a2c20;color:#fff;border-radius:8px;padding:2px 8px;display:none}
@media (min-aspect-ratio:1/1) and (min-width:820px){
  #main{flex-direction:row;align-items:flex-start;height:calc(100dvh - 88px)}
  #boardwrap{width:min(calc(100dvh - 96px),62vw);margin:0;flex:none}
  #side{flex:1;max-width:none;height:100%;overflow:auto;margin:0}
  #game{height:100dvh;overflow:hidden}
}

.cell.owned{box-shadow:inset 0 0 0 .6cqw var(--oc);background:color-mix(in srgb,var(--oc) 24%,#eaf3e2)}
.cell .ob{position:absolute;z-index:2;width:4.4cqw;height:4.4cqw;border-radius:50%;border:.4cqw solid var(--oc);background-size:cover;background-position:center;text-align:center;font-size:2.6cqw;line-height:3.6cqw;font-style:normal;right:.5cqw;top:.5cqw;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.cell.b .ob{top:24%}
.cell.l .ob{left:.5cqw;right:auto}
.emgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.em{padding:6px;font-size:1.7rem;background:#0b2a20;border:2px solid transparent;border-radius:10px;line-height:1.1}
.em.on{border-color:#ffd54a}
.btnlike{display:block;text-align:center;background:#1f6b50;color:#f4f1e6;border-radius:12px;padding:12px 8px;font-weight:700;cursor:pointer;font-size:.9rem}
#timer{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 12px;height:26px;overflow:hidden;font-weight:800;font-size:.85rem;transition:background .3s}
#timer .tb{position:absolute;left:0;top:0;bottom:0;transition:width .3s linear;opacity:.35;background:#000}
#timer .tt,#timer .tn{position:relative}
#timer .tn{font-size:1.05rem}
#timer.bw{background:#f2f2f2;color:#111}
#timer.yellow{background:#ffd54a;color:#2b2200}
#timer.red{background:#e03a3e;color:#fff;animation:blink .5s infinite alternate}
#timer.red .tn{font-size:1.25rem}
@keyframes blink{from{filter:brightness(1)}to{filter:brightness(1.35)}}
.fxbar{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:35;background:#fff;color:#1b2b22;border-radius:14px;padding:10px 16px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:fxin .3s,fxout .4s 3.2s forwards;max-width:92vw;font-size:.95rem}
.fxbar .amt{font-size:1.5rem;font-weight:900;color:#c0392b;display:block}
@keyframes fxin{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes fxout{to{opacity:0;transform:translate(-50%,-20px)}}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.pc{min-width:22px;height:22px;border-radius:5px;border:2px solid #fff;color:#111;font-size:.7rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.pc.m{opacity:.4;border-style:dashed}
.np{opacity:.85}

</style>

E.BOARD = BOARD; E.GC = GC; E.GN = GN; E.GROUP_SQ = GROUP_SQ; E.STATIONS = STATIONS; E.UTILITIES = UTILITIES;

/* ================= utilidades de estado ================= */
function P(G, id) { return G.players.find(p => p.id === id); }

function log(G, msg) { G.log.push(msg); if (G.log.length > 80) G.log.shift(); G.seq++; }
function E1(err) { return { err }; }
E.P = P; E.cur = cur;

E.newGame = function (list, opts) {
  opts = opts || {};

    v: 1,
    players: list.map(p => ({ id: p.id, name: p.name, color: p.color, emoji: p.emoji || '🙂', bot: !!p.bot, money: E.START_MONEY, pos: 0, jail: false, jt: 0, cards: [], out: false })),
    props: {}, turn: 0, phase: 'roll', dice: [1, 1], rollId: 0, dbl: 0, lastDouble: false, extra: false,
    pending: null, auction: null, auctionQueue: [], afterAuction: 'finish', trade: null, tradeId: 0,
    houses: 32, hotels: 12, log: [], seq: 0, winner: null, card: null, cardN: 0, moves: {}, turns: 0,
    limit: opts.limit | 0, tEnd: 0, aEnd: 0, autoTurn: null, fx: null, fxN: 0,
  };
  BOARD.forEach((s, i) => { if (ownable(s)) G.props[i] = { o: null, h: 0, m: false }; });
  G.chance = shuffle(CHANCE.map((_, i) => i));
  G.chest = shuffle(CHEST.map((_, i) => i));
  G.turn = rnd(list.length);
  log(G, `¡Empieza la partida! Salen todos con ${E.START_MONEY} €. Comienza ${cur(G).name}.`);
  return G;
};

function groupSq(g) { return GROUP_SQ[g]; }
function hasSet(G, pid, g) { return groupSq(g).every(i => G.props[i].o === pid); }
function countOwned(G, pid, list) { return list.filter(i => G.props[i].o === pid).length; }

function rentFor(G, sq, diceTot) {
  const s = BOARD[sq], pr = G.props[sq];
  if (!pr || !pr.o || pr.m) return 0;
  if (s.t === 'prop') {
    if (pr.h > 0) return s.rent[pr.h];
    return s.rent[0] * (hasSet(G, pr.o, s.g) ? 2 : 1);
  }
  if (s.t === 'station') { const n = countOwned(G, pr.o, STATIONS); return 25 * Math.pow(2, n - 1); }

}

function netWorth(G, p) {

    const pr = G.props[k]; if (pr.o !== p.id) return;
    const s = BOARD[k]; w += pr.m ? s.price / 2 : s.price;
    if (s.t === 'prop') w += pr.h * s.hc;

}
E.netWorth = netWorth;

/* ================= dinero y deudas ================= */
function pay(G, p, amt, to, why) {
  p.money -= amt; G.fx = { n: ++G.fxN, from: p.id, to, amt, why: why || '' };
  if (to === 'bank') return;
  if (to === 'each') { const others = alive(G).filter(q => q !== p); const per = amt / others.length; others.forEach(q => q.money += per); return; }
  P(G, to).money += amt;
}
function charge(G, p, amt, to, why, then) {
  if (amt <= 0) return true;

  G.phase = 'debt';
  log(G, `${p.name} debe ${amt} € (${why}) y no le llega: tiene que vender o hipotecar.`);
  return false;
}
function checkDebt(G) {
  const d = G.pending; if (!d || d.type !== 'debt') return;
  const p = P(G, d.pid); if (!p || p.out) return;
  if (p.money >= d.amt) {
    pay(G, p, d.amt, d.to, d.why); log(G, `${p.name} paga ${d.amt} € (${d.why}).`);
    G.pending = null;

  }
}

/* ================= flujo de turno ================= */
function finishResolve(G) {

}

  G.turn = i; G.autoTurn = null; G.phase = 'roll'; G.dbl = 0; G.lastDouble = false; G.extra = false; G.pending = null; G.turns++;

}
function endGame(G, w) {

  log(G, w ? `🏆 ¡${w.name} gana la partida!` : 'Fin de la partida.');
}
function checkWinner(G) { if (!G.winner) { const al = alive(G); if (al.length <= 1) endGame(G, al[0]); } }

function sendJail(G, p) { p.pos = 10; p.jail = true; p.jt = 0; G.dbl = 0; G.lastDouble = false; G.moves[p.id] = { mode: 'jump', n: G.seq }; }

function move(G, p, steps) {
  const np = (p.pos + steps + 40) % 40;
  if (steps > 0 && p.pos + steps >= 40) { p.money += E.GO_MONEY; log(G, `${p.name} pasa por la Salida y cobra ${E.GO_MONEY} €.`); }
  G.moves[p.id] = { mode: steps > 0 ? 'fwd' : 'jump', n: G.seq };
  p.pos = np; land(G, p);
}
function moveTo(G, p, dest, opt) {
  if (dest < p.pos) { p.money += E.GO_MONEY; log(G, `${p.name} pasa por la Salida y cobra ${E.GO_MONEY} €.`); }
  G.moves[p.id] = { mode: 'fwd', n: G.seq };
  p.pos = dest; land(G, p, opt);
}

function land(G, p, opt) {
  opt = opt || {};
  const i = p.pos, s = BOARD[i];
  switch (s.t) {
    case 'go': case 'parking': case 'jail': return finishResolve(G);
    case 'gotojail': log(G, `${p.name} va directo a la cárcel.`); sendJail(G, p); return finishResolve(G);
    case 'tax': log(G, `${p.name} paga ${s.amt} € de ${s.n.toLowerCase()}.`); if (charge(G, p, s.amt, 'bank', s.n)) finishResolve(G); return;
    case 'chance': case 'chest': return drawCard(G, p, s.t);

      const pr = G.props[i];
      if (!pr.o) { G.pending = { type: 'buy', sq: i }; G.phase = 'buy'; return; }
      if (pr.o === p.id) return finishResolve(G);
      if (pr.m) { log(G, `${s.n} está hipotecada: no se cobra alquiler.`); return finishResolve(G); }
      let rent;
      if (s.t === 'utility') {
        if (opt.utilTen) { const a = 1 + rnd(6), b = 1 + rnd(6); G.dice = [a, b]; G.rollId++; rent = (a + b) * 10; }
        else rent = rentFor(G, i, G.dice[0] + G.dice[1]);
      } else { rent = rentFor(G, i); if (opt.double) rent *= 2; }
      log(G, `${p.name} cae en ${s.n}: alquiler de ${rent} € para ${P(G, pr.o).name}.`);
      if (charge(G, p, rent, pr.o, 'Alquiler de ' + s.n)) finishResolve(G);
    }

}

function nearest(list, pos) { for (const x of list) if (x > pos) return x; return list[0]; }

function drawCard(G, p, kind) {
  const deck = G[kind], defs = kind === 'chance' ? CHANCE : CHEST;
  const id = deck.shift(), c = defs[id];
  G.cardN++; G.card = { n: G.cardN, deck: kind, text: c.t, pid: p.id };
  log(G, `${p.name} roba ${kind === 'chance' ? 'Suerte' : 'Caja de Comunidad'}: ${c.t}`);
  if (c.k === 'jailfree') { p.cards.push(kind); return finishResolve(G); }
  deck.push(id);
  switch (c.k) {
    case 'to': return moveTo(G, p, c.d);
    case 'near':
      if (c.w === 'station') return moveTo(G, p, nearest(STATIONS, p.pos), { double: true });
      return moveTo(G, p, nearest(UTILITIES, p.pos), { utilTen: true });
    case 'back': G.moves[p.id] = { mode: 'jump', n: G.seq }; p.pos = (p.pos - c.n + 40) % 40; return land(G, p);
    case 'gain': p.money += c.a; return finishResolve(G);
    case 'pay': if (charge(G, p, c.a, 'bank', 'Carta')) finishResolve(G); return;
    case 'jail': sendJail(G, p); return finishResolve(G);
    case 'eachpay': {
      const n = alive(G).length - 1;
      if (charge(G, p, c.a * n, 'each', 'Carta')) finishResolve(G); return;
    }
    case 'eachgain':

      return finishResolve(G);

      const tot = h * c.h + H * c.H;
      log(G, `${p.name} tiene ${h} casa(s) y ${H} hotel(es): ${tot} €.`);
      if (tot === 0 || charge(G, p, tot, 'bank', 'Reformas')) finishResolve(G); return;
    }

/* ================= subastas ================= */
function nextAuction(G) {
  if (G.auctionQueue.length === 0) {
    G.auction = null;
    if (G.afterAuction === 'next') nextTurn(G); else finishResolve(G);
    return;
  }
  const sq = G.auctionQueue.shift();
  G.auction = { sq, bid: 0, bidder: null, passed: [] }; G.phase = 'auction'; G.pending = null;
  log(G, `Subasta: ${BOARD[sq].n} (salida 10 €).`);
}
function checkAuctionEnd(G) {
  const a = G.auction; if (!a) return;
  const act = alive(G).filter(q => !a.passed.includes(q.id));
  if (a.bidder ? act.length <= 1 : act.length === 0) concludeAuction(G);
}
function concludeAuction(G) {
  const a = G.auction;
  if (a.bidder) {
    const w = P(G, a.bidder); w.money -= a.bid; G.props[a.sq].o = w.id;
    log(G, `${w.name} se queda ${BOARD[a.sq].n} por ${a.bid} €.`);
  } else log(G, `Nadie puja por ${BOARD[a.sq].n}: se queda en el banco.`);
  G.auction = null; nextAuction(G);
}

/* ================= gestión: construir, vender, hipotecar ================= */
function buildErr(G, p, sq) {
  const s = BOARD[sq], pr = G.props[sq];
  if (G.winner || G.phase === 'auction') return 'Ahora no se puede.';
  if (!s || s.t !== 'prop' || pr.o !== p.id) return 'No es tu calle.';
  if (!hasSet(G, p.id, s.g)) return 'Necesitas todas las calles del color.';
  const grp = groupSq(s.g);
  if (grp.some(i => G.props[i].m)) return 'Hay calles hipotecadas en el grupo.';
  if (pr.h >= 5) return 'Ya tiene hotel.';
  if (pr.h > Math.min(...grp.map(i => G.props[i].h))) return 'Construye de forma pareja.';
  if (p.money < s.hc) return 'No tienes dinero suficiente.';
  if (pr.h === 4) { if (G.hotels <= 0) return 'No quedan hoteles.'; }
  else if (G.houses <= 0) return 'No quedan casas.';
  return null;
}
function sellErr(G, p, sq) {
  const s = BOARD[sq], pr = G.props[sq];
  if (G.winner || G.phase === 'auction') return 'Ahora no se puede.';
  if (!s || s.t !== 'prop' || pr.o !== p.id || pr.h <= 0) return 'No hay nada que vender.';
  if (pr.h < Math.max(...groupSq(s.g).map(i => G.props[i].h))) return 'Vende de forma pareja.';
  return null;
}
function mortErr(G, p, sq) {
  const s = BOARD[sq], pr = G.props[sq];
  if (G.winner || G.phase === 'auction') return 'Ahora no se puede.';
  if (!s || !ownable(s) || pr.o !== p.id) return 'No es tu propiedad.';
  if (pr.m) return 'Ya está hipotecada.';
  if (s.t === 'prop' && groupSq(s.g).some(i => G.props[i].h > 0)) return 'Vende antes los edificios del grupo.';
  return null;
}
function unmortCost(sq) { return Math.ceil(priceOf(sq) / 2 * 1.1); }
function unmortErr(G, p, sq) {
  const s = BOARD[sq], pr = G.props[sq];
  if (G.winner || G.phase === 'auction') return 'Ahora no se puede.';
  if (!s || !ownable(s) || pr.o !== p.id || !pr.m) return 'No está hipotecada.';
  if (p.money < unmortCost(sq)) return 'No tienes dinero suficiente.';
  return null;
}
E.buildErr = buildErr; E.sellErr = sellErr; E.mortErr = mortErr; E.unmortErr = unmortErr; E.unmortCost = unmortCost;

/* ================= intercambios ================= */
function sideErr(G, pid, side) {
  const pl = P(G, pid);
  if (!Number.isInteger(side.m) || side.m < 0) return 'Cantidad no válida.';
  if (pl.money < side.m) return `${pl.name} no tiene ${side.m} €.`;
  if ((side.j || 0) > pl.cards.length) return `${pl.name} no tiene tantas cartas de cárcel.`;
  for (const sq of side.p) {
    const pr = G.props[sq];
    if (!pr || pr.o !== pid) return 'Propiedad no válida.';
    const s = BOARD[sq];
    if (s.t === 'prop' && groupSq(s.g).some(i => G.props[i].h > 0)) return `Hay edificios en el grupo de ${s.n}: hay que venderlos antes.`;
  }
  return null;
}
function feeFor(G, side) { return side.p.reduce((a, sq) => a + (G.props[sq].m ? Math.ceil(priceOf(sq) / 2 * 0.1) : 0), 0); }
function tradeErr(G, t) {
  const a = P(G, t.from), b = P(G, t.to);
  if (!a || !b || a.out || b.out || a === b) return 'Jugadores no válidos.';
  const e = sideErr(G, t.from, t.offer) || sideErr(G, t.to, t.req); if (e) return e;
  if (!t.offer.m && !t.offer.p.length && !t.offer.j && !t.req.m && !t.req.p.length && !t.req.j) return 'El trato está vacío.';
  if (a.money - t.offer.m + t.req.m < feeFor(G, t.req)) return `${a.name} no puede pagar el 10% de las hipotecadas.`;
  if (b.money - t.req.m + t.offer.m < feeFor(G, t.offer)) return `${b.name} no puede pagar el 10% de las hipotecadas.`;
  return null;
}
function applyTrade(G, t) {
  const a = P(G, t.from), b = P(G, t.to);
  const fa = feeFor(G, t.req), fb = feeFor(G, t.offer);
  a.money += t.req.m - t.offer.m - fa; b.money += t.offer.m - t.req.m - fb;
  t.offer.p.forEach(sq => G.props[sq].o = b.id); t.req.p.forEach(sq => G.props[sq].o = a.id);
  for (let k = 0; k < (t.offer.j || 0); k++) b.cards.push(a.cards.shift());
  for (let k = 0; k < (t.req.j || 0); k++) a.cards.push(b.cards.shift());
  log(G, `🤝 Trato cerrado entre ${a.name} y ${b.name}.`);
}

/* ================= bancarrota ================= */
function bankrupt(G, p, cred) {
  log(G, `💥 ${p.name} se declara en bancarrota.`);
  const creditor = (cred && cred !== 'bank' && cred !== 'each') ? P(G, cred) : null;
  const sqs = Object.keys(G.props).map(Number).filter(k => G.props[k].o === p.id);
  let sold = 0;
  sqs.forEach(sq => { const pr = G.props[sq]; sold += pr.h * BOARD[sq].hc / 2; if (pr.h === 5) G.hotels++; else G.houses += pr.h; pr.h = 0; });
  if (cred === 'each') {
    const others = alive(G).filter(q => q !== p), share = Math.floor((p.money + sold) / others.length);
    others.forEach(q => q.money += share);
    p.money = 0;
  }
  if (creditor) {
    creditor.money += p.money + sold; creditor.cards.push(...p.cards);
    sqs.forEach(sq => {
      const pr = G.props[sq]; pr.o = creditor.id;
      if (pr.m) { const fee = Math.min(creditor.money, Math.ceil(priceOf(sq) / 2 * 0.1)); creditor.money -= fee; }
    });
    G.auctionQueue = [];
  } else {
    p.cards.forEach(k => { const defs = k === 'chance' ? CHANCE : CHEST; G[k].push(defs.findIndex(c => c.k === 'jailfree')); });
    sqs.forEach(sq => { const pr = G.props[sq]; pr.o = null; pr.m = false; });
    G.auctionQueue = sqs.slice();
  }
  p.cards = []; p.money = 0; p.out = true; p.jail = false;
  if (G.trade && (G.trade.from === p.id || G.trade.to === p.id)) G.trade = null;
  G.pending = null;
  if (alive(G).length <= 1) { endGame(G, alive(G)[0]); return; }
  if (G.auctionQueue.length) { G.afterAuction = 'next'; nextAuction(G); } else nextTurn(G);
}

/* ================= acciones ================= */
const ACT = {
  roll(G, p) {
    if (cur(G) !== p) return E1('No es tu turno.');
    if (G.phase !== 'roll') return E1('Ahora no puedes tirar.');
    const d1 = 1 + rnd(6), d2 = 1 + rnd(6), tot = d1 + d2, dbl = d1 === d2;
    G.dice = [d1, d2]; G.rollId++; G.extra = false;
    log(G, `${p.name} saca ${d1} y ${d2}${dbl ? ' (¡doble!)' : ''}.`);
    if (p.jail) {
      if (dbl) { p.jail = false; p.jt = 0; G.lastDouble = false; G.dbl = 0; log(G, `${p.name} saca doble y sale de la cárcel.`); return move(G, p, tot); }
      p.jt++;
      if (p.jt >= 3) {
        p.jail = false; p.jt = 0; G.lastDouble = false;
        log(G, `${p.name} falla el tercer intento: paga ${E.JAIL_FINE} € y avanza.`);
        if (!charge(G, p, E.JAIL_FINE, 'bank', 'Fianza de la cárcel', { k: 'move', n: tot })) return;
        return move(G, p, tot);
      }
      log(G, `${p.name} no saca doble y sigue en la cárcel (intento ${p.jt}/3).`);
      G.lastDouble = false; G.phase = 'act'; return;
    }
    if (dbl) { G.dbl++; if (G.dbl >= 3) { log(G, `${p.name} saca tres dobles seguidos: ¡a la cárcel!`); sendJail(G, p); return finishResolve(G); } }
    else G.dbl = 0;
    G.lastDouble = dbl;
    move(G, p, tot);
  },
  jailPay(G, p) {
    if (cur(G) !== p || G.phase !== 'roll' || !p.jail) return E1('No puedes hacer eso ahora.');
    if (p.money < E.JAIL_FINE) return E1('No tienes 50 €.');
    p.money -= E.JAIL_FINE; p.jail = false; p.jt = 0; log(G, `${p.name} paga ${E.JAIL_FINE} € y sale de la cárcel.`);
  },
  jailCard(G, p) {
    if (cur(G) !== p || G.phase !== 'roll' || !p.jail) return E1('No puedes hacer eso ahora.');
    if (!p.cards.length) return E1('No tienes ninguna carta.');
    const k = p.cards.shift(); const defs = k === 'chance' ? CHANCE : CHEST;
    G[k].push(defs.findIndex(c => c.k === 'jailfree'));
    p.jail = false; p.jt = 0; log(G, `${p.name} usa su carta y sale de la cárcel.`);
  },
  buy(G, p) {
    const d = G.pending;
    if (!d || d.type !== 'buy' || cur(G) !== p) return E1('No hay nada que comprar.');

  auction(G, p) {

  bid(G, p, a) {

  unmortgage(G, p, a) {

  tradeDecline(G, p) {

function val(G, side) { return side.m + side.p.reduce((a, sq) => a + priceOf(sq) * (G.props[sq].m ? 0.6 : 1), 0) + (side.j || 0) * 50; }

      const v = s.price * (1 + 0.3 * ownInGroup(G, b.id, a.sq)) * 1.05;
      const nb = Math.max(10, a.bid + 10);
      if (nb <= v && nb <= b.money - 50) return { pid: b.id, k: 'bid', amt: nb };
      return { pid: b.id, k: 'pass' };

        if (p.money >= 600) return { pid: p.id, k: 'jailPay' };

      if (p.money - s.price >= (synergy ? 50 : 200)) return { pid: p.id, k: 'buy' };

      return { pid: p.id, k: 'resign' };

    const n = Object.keys(G.props).filter(i => G.props[i].o === p.id).length;
    const l = lobby.find(x => x.id === p.id) || {};
    return `<div class="pl">${av(p.id)}<div class="grow"><b>${esc(p.name)}</b> ${p.bot ? '🤖' : ''}${p.out ? ' · fuera' : ''}${p.jail ? ' · 🔒' : ''}${l.connected === false && !p.bot ? ' · ⚠️ desconectado' : ''}<div class="muted">${eur(p.money)} · ${n} propiedades · patrimonio ${eur(E.netWorth(G, p))}</div><div class="chips">${ownChips(p.id)}</div></div>${isHost() && !p.out ? `<button class="sm dark" data-bot="${p.id}">${p.bot ? 'Quitar robot' : 'Que juegue un robot'}</button>` : ''}</div>`;
  }).join('');
  return r + (isHost() ? '<button class="dark sm" id="bFinish">⏱ Cerrar partida por patrimonio</button>' : '');
}

function rulesHTML() {
  return `<div style="font-size:.88rem;line-height:1.4"><h3>📖 Reglas (Monopoly clásico)</h3>
  <p><b>Objetivo:</b> quedarte como único jugador con dinero. Salís todos con 1.500 € y se cobran 200 € cada vez que se pasa por la SALIDA.</p>
  <p><b>Turno:</b> tira los dados y avanza. Si sacas <b>doble</b> vuelves a tirar; al tercer doble seguido vas a la cárcel.</p>
  <p><b>Casilla libre:</b> puedes comprarla o se subasta entre todos (sale en 10 €). Si tiene dueño, pagas alquiler. Con todas las calles de un color, el alquiler sin casas se dobla.</p>
  <p><b>Casas y hoteles:</b> con el grupo completo, construye de forma pareja (hasta 4 casas y luego hotel). Hay 32 casas y 12 hoteles. Vender devuelve la mitad.</p>
  <p><b>Estaciones:</b> 25/50/100/200 € según cuántas tengas. <b>Servicios:</b> 4× o 10× los dados.</p>
  <p><b>Cárcel:</b> sales pagando 50 €, con una carta, o sacando doble (3 intentos; al tercero pagas 50 €). Mientras tanto puedes cobrar y comerciar. <b>Aparcamiento libre:</b> no pasa nada.</p>
  <p><b>Hipotecas:</b> recibes la mitad del precio (sin edificios en el grupo). Cancelarla cuesta esa mitad + 10 %. No se cobra alquiler de calles hipotecadas.</p>
  <p><b>Tratos:</b> propiedades, dinero y cartas, cuando quieras. No se pueden pasar calles de un grupo con edificios. Si recibes una hipotecada pagas el 10 %.</p>
  <p><b>Bancarrota:</b> si debes más de lo que puedes reunir, quedas fuera. Si debes a un jugador, se lo queda todo; si es al banco, se subastan tus propiedades.</p>
  <p>Cartas: <b>Suerte</b> y <b>Caja de Comunidad</b> se roban de arriba y van al fondo (la de salir de la cárcel te la quedas).</p></div>`;
}

/* ---------- ficha de una casilla ---------- */
function showDeed(i) {
  const s = BOARD[i], pr = G.props[i];
  let body = '';
  if (s.t === 'prop') {
    body = `<table>${['Alquiler', 'Con 1 casa', 'Con 2 casas', 'Con 3 casas', 'Con 4 casas', 'Con hotel'].map((l, k) => `<tr><td>${l}</td><td>${s.rent[k]} €</td></tr>`).join('')}</table>
      <p>Grupo completo sin casas: alquiler doble<br>Casa/hotel: ${s.hc} € cada uno · Hipoteca: ${s.price / 2} €</p>`;
  } else if (s.t === 'station') body = `<table><tr><td>1 estación</td><td>25 €</td></tr><tr><td>2 estaciones</td><td>50 €</td></tr><tr><td>3 estaciones</td><td>100 €</td></tr><tr><td>4 estaciones</td><td>200 €</td></tr></table><p>Hipoteca: ${s.price / 2} €</p>`;
  else if (s.t === 'utility') body = `<p>Con 1 servicio: 4 × los dados.<br>Con los 2: 10 × los dados.</p><p>Hipoteca: ${s.price / 2} €</p>`;
  else if (s.t === 'tax') body = `<p>Pagas ${s.amt} € al banco.</p>`;
  else if (s.t === 'chance') body = '<p>Roba una carta de Suerte.</p>';
  else if (s.t === 'chest') body = '<p>Roba una carta de Caja de Comunidad.</p>';
  else if (s.t === 'go') body = '<p>Cobras 200 € al pasar o caer aquí.</p>';
  else if (s.t === 'jail') body = '<p>Solo de visita… o preso. Se sale pagando 50 €, con una carta o sacando doble.</p>';
  else if (s.t === 'parking') body = '<p>Descansas: no pasa nada.</p>';
  else if (s.t === 'gotojail') body = '<p>Vas directo a la cárcel sin cobrar.</p>';
  const owner = pr && pr.o ? `<p>Dueño: ${av(pr.o, 'xs')} <b>${esc(plr(pr.o).name)}</b>${pr.m ? ' (hipotecada)' : ''}${pr.h ? ' · ' + (pr.h === 5 ? 'hotel' : pr.h + ' casa(s)') : ''}</p>` : (pr ? '<p>Sin dueño · ' + s.price + ' €</p>' : '');
  modal(`<div class="deed"><div class="hd" style="background:${s.g ? GC[s.g] : '#ddd'};color:${s.g === 'ama' || s.g === 'cel' ? '#111' : (s.g ? '#fff' : '#111')}">${esc(s.n)}</div><div class="bd">${body}${owner}</div></div><button onclick="__bpClose()">Cerrar</button>`);
}

function showWinner() {
  if (!G || !G.winner) return;
  if (!showWinner.s) { showWinner.s = 1; SFX.win(); }
  const rk = G.players.slice().sort((a, b) => (b.id === G.winner) - (a.id === G.winner) || E.netWorth(G, b) - E.netWorth(G, a));
  modal(`<h2 style="text-align:center">🏆 ¡${esc(plr(G.winner).name)} gana BonPasPoly!</h2>${rk.map((p, i) => `<div class="rank"><b>${i + 1}.</b>${av(p.id)}<span class="grow">${esc(p.name)}${p.out ? ' (bancarrota)' : ''}</span><b>${p.out ? '—' : eur(E.netWorth(G, p))}</b></div>`).join('')}<button onclick="__bpClose()">Cerrar</button>`);
}

/* ---------- tratos ---------- */
function openTrade() {
  const v = viewer(); if (!v || v.out) return;
  const others = G.players.filter(p => !p.out && p.id !== v.id);
  if (!others.length) return;
  let to = others[0].id;
  const html = () => {
    const A = E.P(G, v.id), B = E.P(G, to);
    const side = (p, pre, ttl) => {
      const ps = Object.keys(G.props).map(Number).filter(i => G.props[i].o === p.id);
      return `<div><b>${ttl} (${esc(p.name)})</b>
        <label>€ <input type="number" min="0" max="${p.money}" value="0" id="${pre}m" style="padding:6px"></label>
        ${p.cards.length ? `<label>🎫 cartas <input type="number" min="0" max="${p.cards.length}" value="0" id="${pre}j" style="padding:6px"></label>` : ''}
        ${ps.map(i => { const s = BOARD[i], blocked = s.t === 'prop' && E.groupSq(s.g).some(k => G.props[k].h > 0); return `<label style="opacity:${blocked ? .4 : 1}"><input type="checkbox" data-${pre} value="${i}" ${blocked ? 'disabled' : ''}><span style="width:8px;height:16px;background:${s.g ? GC[s.g] : '#888'};display:inline-block"></span>${esc(s.s)}${G.props[i].m ? ' (hip.)' : ''}</label>`; }).join('') || '<span class="muted">Sin propiedades</span>'}</div>`;
    };
    return `<h3>🤝 Proponer trato</h3><label>Con: <select id="tTo">${others.map(p => `<option value="${p.id}" ${p.id === to ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
      <div class="trade-cols">${side(A, 'of', 'Ofreces')}${side(B, 'rq', 'Pides')}</div>
      <div class="btns"><button id="tSend">Enviar propuesta</button><button class="dark" onclick="__bpClose()">Cancelar</button></div>`;
  };
  const draw = () => {
    modal(html());
    $('#tTo').onchange = e => { to = e.target.value; draw(); };
    $('#tSend').onclick = () => {
      const rd = pre => ({ m: +($('#' + pre + 'm').value) || 0, j: $('#' + pre + 'j') ? (+$('#' + pre + 'j').value || 0) : 0, p: [...document.querySelectorAll('[data-' + pre + ']:checked')].map(c => +c.value) });
      dispatch({ k: 'tradePropose', pid: v.id, to, offer: rd('of'), req: rd('rq') }); closeModal();
    };
  };
  draw();
}

/* ======================= ARRANQUE ======================= */
window.addEventListener('DOMContentLoaded', () => {
  const sala = new URLSearchParams(location.search).get('sala');
  show('home');
  if (sala && sala.length === 4) { const c = $('#code'); if (c) c.value = sala.toUpperCase(); }
});
})();

</script>
</body>
